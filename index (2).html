<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Feliz Cumpleaños, preciosa!</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffe3ec;
    --bg2: #e9d8ff;
    --ink: #4a2c3b;
    --accent: #e0457b;
    --card: rgba(255,255,255,.75);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Lato', sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    text-align: center;
    overflow-x: hidden;
  }
  section { padding: 56px 20px; max-width: 720px; margin: 0 auto; }
  h1, h2 { font-family: 'Playfair Display', serif; }
  h1 { font-size: clamp(2.4rem, 8vw, 4rem); color: var(--accent); margin-bottom: 12px; }
  h2 { font-size: 1.8rem; margin-bottom: 20px; }
  .subtitle { font-size: 1.15rem; font-weight: 300; margin-bottom: 28px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 14px 32px; font-size: 1.05rem; cursor: pointer;
    box-shadow: 0 6px 18px rgba(224,69,123,.35); transition: transform .15s;
  }
  button:hover { transform: scale(1.05); }
  .card {
    background: var(--card); border-radius: 18px; padding: 28px 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08); backdrop-filter: blur(6px);
  }
  #message { display: none; white-space: pre-line; line-height: 1.8; font-size: 1.1rem; margin-top: 24px; text-align: left; }
  #message.show { display: block; animation: fade 1.2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .countdown { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .countdown div { background: var(--card); border-radius: 14px; padding: 14px 18px; min-width: 76px; }
  .countdown strong { display: block; font-size: 1.8rem; color: var(--accent); font-family: 'Playfair Display', serif; }
  .countdown span { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }

  ol { text-align: left; padding-left: 1.4em; line-height: 1.9; }

  /* Central photo */
  .hero { display: none; margin: 10px auto 26px; max-width: 340px; }
  .hero.show { display: block; }
  .hero img {
    width: 100%; max-height: 440px; object-fit: cover; display: block;
    border: 8px solid #fff; border-radius: 22px;
    box-shadow: 0 14px 40px rgba(224,69,123,.3);
    transform: rotate(-2deg); transition: transform .3s; cursor: zoom-in;
  }
  .hero img:hover { transform: rotate(0deg) scale(1.02); }

  /* Timeline */
  .timeline { text-align: left; border-left: 3px solid var(--accent); margin-left: 10px; padding-left: 22px; }
  .timeline .item { position: relative; margin-bottom: 26px; }
  .timeline .item::before {
    content: ''; position: absolute; left: -31px; top: 6px; width: 15px; height: 15px;
    background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 4px rgba(224,69,123,.2);
  }
  .timeline .date { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1.05rem; }
  .timeline .text { line-height: 1.6; }

  /* Gallery */
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .gallery img { width: 100%; height: 220px; object-fit: cover; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.12); cursor: zoom-in; transition: transform .2s; }
  .gallery img:hover { transform: scale(1.03); }
  .broken { background: #fff; border: 2px dashed var(--accent); border-radius: 14px; padding: 12px; font-size: .75rem; word-break: break-all; display: flex; align-items: center; justify-content: center; min-height: 120px; }

  /* Lightbox */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 50; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 10px; }

  /* Music button */
  #musicBtn {
    display: none; position: fixed; right: 16px; bottom: 16px; z-index: 40;
    width: 52px; height: 52px; padding: 0; font-size: 1.4rem;
  }

  .heart { position: fixed; bottom: -30px; font-size: 22px; opacity: .7; animation: rise linear forwards; pointer-events: none; }
  @keyframes rise { to { transform: translateY(-110vh); opacity: 0; } }
  footer { padding: 30px; font-size: .9rem; opacity: .7; }
</style>
</head>
<body>

<!-- ============================================================
     EDIT THIS PART ONLY. Everything else works by itself.
     Keep the quotation marks "like this" around your text.
     ============================================================ -->
<script>
  const SETTINGS = {
    herName:  "Mi Jemina preciosa",
    yourName: "Yo pues quién más",
    subtitle: "Te amo mucho <3",

    // The date you will see each other again (YEAR-MONTH-DAY).
    // Leave it as "" if you don't want a countdown.
    reunionDate: "2026-12-20",
    reunionText: "para poder abrazarte",

    // CENTRAL PHOTO: shown right under the title.
    // Write the file name of your favorite photo. Leave "" to hide it.
    heroPhoto: "",

    // MUSIC: upload an .mp3 next to this file and write its name here.
    // It starts when she presses the gift button. Leave "" for no music.
    music: "",

    message: `Feliz Cumpleaños, mi vidita!

A pesar de estar lejos, estoy muy orgulloso de todo lo que estás logrando.
Eres la mejor del mundo mundial y espero que cumplas todos tus sueños :D
Espero estar ahí en cada pasito que das y que sepas que cuentas conmigo para
todo lo que tú necesites. Te amo mucho. Eres el amor de mi vida. 

Ai lof u very mach <3.`,

    reasons: [
      "Una niña muy inteligente.",
      "Siempre estás pendiente de nosotros.",
      "Nunca te rindes tan fácil y siempre luchas por lo que crees.",
      "Una niña muy tierna y preciosa que quiere superarse siempre.",
      "Por ser tú."
    ],

    // OUR STORY (optional). Add the moments that matter to you.
    // Leave [] to hide this section. Example:
    // { date: "20 de enero de 2023", text: "El día que empezamos a hablar." },
    timeline: [],

    // Photo file names (same place as this file).
    photos: ["Screenshot_20230120-220028_Instagram.jpg", "WhatsApp Image 2026-10-18 at 23.59.32 (1).jpeg",
            "WhatsApp Image 2026-10-18 at 23.59.32 (2).jpeg", "WhatsApp Image 2026-10-18 at 23.59.32.jpeg",
            "WhatsApp Image 2026-10-18 at 23.59.40 (1).jpeg", "WhatsApp Image 2026-10-18 at 23.59.40.jpeg",
            "WhatsApp Image 2026-10-18 at 23.59.41 (1).jpeg", "WhatsApp Image 2026-10-18 at 23.59.41 (2).jpeg",
            "WhatsApp Image 2026-10-18 at 23.59.41 (3).jpeg", "WhatsApp Image 2026-10-18 at 23.59.41 (4).jpeg",
            "WhatsApp Image 2026-10-18 at 23.59.41.jpeg"]
  };
</script>

<section id="top">
  <h1 id="title"></h1>
  <div class="hero" id="hero"><img id="heroImg" alt="Mi persona favorita"></div>
  <p class="subtitle" id="subtitle"></p>
  <button id="openBtn">Abre tu Regalooooo 🎁</button>
  <div class="card" id="message"></div>
</section>

<section id="countdownSection" style="display:none">
  <h2>Contando los días</h2>
  <div class="countdown" id="countdown"></div>
  <p style="margin-top:16px" id="reunionText"></p>
</section>

<section id="reasonsSection">
  <h2>Razones por las que te amo</h2>
  <div class="card"><ol id="reasons"></ol></div>
</section>

<section id="timelineSection" style="display:none">
  <h2>Nuestra historia</h2>
  <div class="card"><div class="timeline" id="timeline"></div></div>
</section>

<section id="gallerySection" style="display:none">
  <h2>Nuestros pequeños momentos (aunque hay más)</h2>
  <div class="gallery" id="gallery"></div>
</section>

<footer id="footer"></footer>

<div id="lightbox"><img alt=""></div>
<button id="musicBtn" title="Música">🎵</button>
<audio id="bgm" loop preload="auto"></audio>

<script>
  const S = SETTINGS;
  document.getElementById('title').textContent = "¡Feliz Cumpleaños, " + S.herName + "! 🎂";
  document.getElementById('subtitle').textContent = S.subtitle;
  document.getElementById('message').textContent = S.message;
  document.getElementById('footer').textContent = "Hecho con amor por " + S.yourName + " ♥";

  // Central photo
  if (S.heroPhoto) {
    const hero = document.getElementById('hero');
    const heroImg = document.getElementById('heroImg');
    heroImg.src = encodeURI(S.heroPhoto);
    hero.classList.add('show');
    heroImg.addEventListener('click', () => {
      const lb = document.getElementById('lightbox');
      lb.querySelector('img').src = heroImg.src; lb.classList.add('show');
    });
    heroImg.addEventListener('error', () => {
      const d = document.createElement('div');
      d.className = 'broken';
      d.textContent = "No se encontró: " + S.heroPhoto;
      heroImg.replaceWith(d);
    });
  }

  // Reasons
  const ol = document.getElementById('reasons');
  S.reasons.forEach(r => { const li = document.createElement('li'); li.textContent = r; ol.appendChild(li); });

  // Timeline
  if (S.timeline && S.timeline.length) {
    document.getElementById('timelineSection').style.display = 'block';
    const t = document.getElementById('timeline');
    S.timeline.forEach(e => {
      const d = document.createElement('div'); d.className = 'item';
      const a = document.createElement('div'); a.className = 'date'; a.textContent = e.date;
      const b = document.createElement('div'); b.className = 'text'; b.textContent = e.text;
      d.append(a, b); t.appendChild(d);
    });
  }

  // Photos (encodeURI makes names with spaces and parentheses safe)
  const lightbox = document.getElementById('lightbox');
  if (S.photos.length) {
    document.getElementById('gallerySection').style.display = 'block';
    const g = document.getElementById('gallery');
    S.photos.forEach(p => {
      const img = document.createElement('img');
      img.src = encodeURI(p);
      img.alt = "Nuestro recuerdo";
      img.loading = "lazy";
      img.addEventListener('click', () => { lightbox.querySelector('img').src = img.src; lightbox.classList.add('show'); });
      // If a photo can't be found, show its name so you can fix it
      img.addEventListener('error', () => {
        const d = document.createElement('div');
        d.className = 'broken';
        d.textContent = "No se encontró: " + p;
        img.replaceWith(d);
      });
      g.appendChild(img);
    });
  }
  lightbox.addEventListener('click', () => lightbox.classList.remove('show'));

  // Countdown
  if (S.reunionDate) {
    document.getElementById('countdownSection').style.display = 'block';
    document.getElementById('reunionText').textContent = S.reunionText;
    const box = document.getElementById('countdown');
    const target = new Date(S.reunionDate + "T00:00:00");
    function tick() {
      let diff = Math.max(0, target - new Date());
      const d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5),
            m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
      box.innerHTML = [[d,'días'],[h,'horas'],[m,'min'],[s,'seg']]
        .map(([n,l]) => `<div><strong>${n}</strong><span>${l}</span></div>`).join('');
    }
    tick(); setInterval(tick, 1000);
  }

  // Music
  const bgm = document.getElementById('bgm');
  const musicBtn = document.getElementById('musicBtn');
  if (S.music) {
    bgm.src = encodeURI(S.music);
    musicBtn.style.display = 'block';
    musicBtn.addEventListener('click', () => {
      if (bgm.paused) { bgm.play().catch(()=>{}); musicBtn.textContent = '🎵'; }
      else { bgm.pause(); musicBtn.textContent = '🔇'; }
    });
  }

  // Floating hearts
  function heart() {
    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = ['💗','💖','💕','🌸'][Math.floor(Math.random()*4)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.animationDuration = (5 + Math.random()*5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 10000);
  }
  setInterval(heart, 700);

  // Open gift (browsers only allow music after a click, so it starts here)
  document.getElementById('openBtn').addEventListener('click', () => {
    document.getElementById('message').classList.add('show');
    document.getElementById('openBtn').style.display = 'none';
    if (S.music) bgm.play().catch(()=>{});
    for (let i = 0; i < 25; i++) setTimeout(heart, i * 80);
  });
</script>
</body>
</html>
