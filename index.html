<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Feliz Cumpleaños, preciosa!</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Lato:wght@300;400;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffd6e7;
    --bg2: #e3d4ff;
    --ink: #4a2c3b;
    --accent: #e0457b;
    --accent2: #8b5cf6;
    --card: rgba(255,255,255,.86);
    --tile: 170px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: linear-gradient(160deg, var(--bg1), var(--bg2)); }
  body {
    font-family: 'Lato', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    text-align: center;
    overflow-x: hidden;
  }

  /* ---------- Photo collage in the background ---------- */
  #collage {
    position: fixed; inset: 0; z-index: -2; overflow: hidden;
    display: flex; flex-wrap: wrap; align-content: flex-start;
  }
  #collage img {
    width: var(--tile); height: var(--tile); object-fit: cover; flex: none;
    transform: rotate(var(--r, 0deg)) scale(1.1);
  }
  #veil {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,182,213,.55), transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(196,170,255,.55), transparent 55%),
      linear-gradient(160deg, rgba(255,230,240,.66), rgba(237,226,255,.66));
  }

  section { padding: 44px 18px; max-width: 980px; margin: 0 auto; }
  h1, h2 { font-family: 'Playfair Display', serif; }
  h1 {
    font-size: clamp(2.4rem, 8vw, 4.2rem); color: var(--accent); margin-bottom: 14px;
    text-shadow: 0 2px 0 #fff, 0 0 24px rgba(255,255,255,.95), 0 0 6px rgba(255,255,255,.9);
  }
  h2 {
    display: inline-block; font-size: 1.6rem; margin-bottom: 24px;
    background: var(--card); padding: 8px 26px; border-radius: 999px;
    box-shadow: 0 6px 20px rgba(224,69,123,.18);
  }
  h2::before { content: '💖 '; }
  h2::after  { content: ' 💖'; }
  .subtitle {
    display: inline-block; font-family: 'Caveat', cursive; font-size: 1.9rem;
    background: var(--card); padding: 4px 22px; border-radius: 999px; margin-bottom: 26px;
  }
  button {
    background: linear-gradient(135deg, #ff7fb0, var(--accent)); color: #fff; border: 0; border-radius: 999px;
    padding: 15px 36px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 22px rgba(224,69,123,.4); transition: transform .15s;
  }
  button:hover { transform: scale(1.06); }
  #openBtn { animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  .card {
    background: var(--card); border-radius: 22px; padding: 30px 26px;
    box-shadow: 0 10px 34px rgba(0,0,0,.12); backdrop-filter: blur(6px);
  }

  /* ---------- Main photo ---------- */
  .hero { display: none; margin: 8px auto 26px; max-width: 360px; }
  .hero.show { display: block; }
  .hero img {
    width: 100%; max-height: 460px; object-fit: cover; display: block;
    border: 9px solid #fff; border-radius: 24px;
    box-shadow: 0 16px 44px rgba(224,69,123,.4);
    transform: rotate(-2deg); transition: transform .3s; cursor: zoom-in;
  }
  .hero img:hover { transform: rotate(0deg) scale(1.02); }

  /* ---------- Message ---------- */
  #message {
    display: none; max-width: 720px; margin: 28px auto 0;
    white-space: pre-line; line-height: 1.9; font-size: 1.15rem; text-align: left;
    border: 3px dashed rgba(224,69,123,.35);
  }
  #message::before { content: '💌'; display: block; text-align: center; font-size: 2.2rem; margin-bottom: 8px; }
  #message.show { display: block; animation: fade 1.2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- Countdown ---------- */
  .countdown { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
  .countdown div {
    background: var(--card); border-radius: 18px; padding: 16px 22px; min-width: 92px;
    box-shadow: 0 8px 22px rgba(139,92,246,.2); border-bottom: 4px solid var(--accent2);
  }
  .countdown strong { display: block; font-size: 2.2rem; color: var(--accent); font-family: 'Playfair Display', serif; }
  .countdown span { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; }
  #reunionText { display: inline-block; margin-top: 18px; background: var(--card); padding: 6px 18px; border-radius: 999px; }

  /* ---------- Reasons ---------- */
  .reasons { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .reason {
    border-radius: 20px; padding: 22px 18px; line-height: 1.6; font-size: 1.05rem;
    box-shadow: 0 8px 22px rgba(0,0,0,.1); transition: transform .2s;
  }
  .reason:hover { transform: translateY(-5px) rotate(-1deg); }
  .reason .em { display: block; font-size: 2rem; margin-bottom: 6px; }

  /* ---------- Timeline ---------- */
  .timeline { text-align: left; border-left: 3px solid var(--accent); margin-left: 10px; padding-left: 22px; }
  .timeline .item { position: relative; margin-bottom: 26px; }
  .timeline .item::before {
    content: ''; position: absolute; left: -31px; top: 6px; width: 15px; height: 15px;
    background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 4px rgba(224,69,123,.2);
  }
  .timeline .date { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1.05rem; }
  .timeline .text { line-height: 1.6; }

  /* ---------- Gallery (polaroids) ---------- */
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 26px 18px; padding: 6px; }
  .polaroid {
    background: #fff; padding: 11px 11px 8px; border-radius: 6px;
    box-shadow: 0 10px 26px rgba(0,0,0,.22);
    transform: rotate(var(--r, 0deg)); transition: transform .25s;
  }
  .polaroid:hover { transform: rotate(0deg) scale(1.06); position: relative; z-index: 2; }
  .polaroid img { width: 100%; height: 240px; object-fit: cover; display: block; border-radius: 3px; cursor: zoom-in; }
  .polaroid figcaption { font-family: 'Caveat', cursive; font-size: 1.5rem; margin-top: 6px; }
  .broken {
    background: #fff; border: 2px dashed var(--accent); border-radius: 14px; padding: 12px;
    font-size: .75rem; word-break: break-all; display: flex; align-items: center; justify-content: center; min-height: 120px;
  }

  /* ---------- Age & counters ---------- */
  .agebox > div { margin-bottom: 14px; }
  .age {
    width: 190px; height: 190px; border-radius: 50%; margin: 0 auto 14px;
    background: linear-gradient(135deg, #ff7fb0, var(--accent2)); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 0 10px rgba(255,255,255,.7), 0 14px 40px rgba(139,92,246,.45);
    animation: pulse 2.6s infinite;
  }
  .age strong { font-family: 'Playfair Display', serif; font-size: 5rem; line-height: 1; }
  .age span { font-size: 1.1rem; letter-spacing: .18em; text-transform: uppercase; }
  .today { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--accent); margin: 8px 0; }
  .pill { display: inline-block; background: #fff; padding: 8px 20px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .sub-h { display: inline-block; font-family: 'Caveat', cursive; font-size: 1.8rem; margin: 18px 0 8px; }

  /* ---------- Plans ---------- */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .chip { padding: 12px 20px; border-radius: 999px; font-size: 1.05rem; box-shadow: 0 6px 16px rgba(0,0,0,.1); }

  /* ---------- "Open when" letters ---------- */
  .letters { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .letter { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 8px 22px rgba(0,0,0,.1); cursor: pointer; }
  .letter .env { font-size: 2.6rem; transition: transform .3s; }
  .letter:hover .env { transform: scale(1.2) rotate(-6deg); }
  .letter .ttl { font-weight: 700; margin-top: 6px; }
  .letter .body { display: none; margin-top: 12px; line-height: 1.7; text-align: left; }
  .letter.open .body { display: block; animation: fade .6s ease; }

  /* ---------- Lightbox ---------- */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 70; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 10px; }

  /* ---------- Music button ---------- */
  #musicBtn {
    display: none; position: fixed; right: 16px; bottom: 16px; z-index: 40;
    width: 56px; height: 56px; padding: 0; font-size: 1.5rem; animation: none;
  }

  .heart { position: fixed; bottom: -30px; font-size: 24px; opacity: .8; z-index: 30; animation: rise linear forwards; pointer-events: none; }
  @keyframes rise { to { transform: translateY(-112vh) rotate(25deg); opacity: 0; } }
  .confetti { position: fixed; top: -14px; width: 9px; height: 14px; z-index: 60; pointer-events: none; animation: drop linear forwards; }
  @keyframes drop { to { transform: translateY(108vh) rotate(720deg); } }

  footer { padding: 34px 20px 70px; }
  footer span { display: inline-block; background: var(--card); padding: 8px 22px; border-radius: 999px; font-size: .95rem; }
</style>
</head>
<body>

<div id="collage"></div>
<div id="veil"></div>

<section id="top">
  <h1 id="title"></h1>
  <div class="hero" id="hero"><img id="heroImg" alt="Mi persona favorita"></div>
  <div><p class="subtitle" id="subtitle"></p></div>
  <button id="openBtn">Abre tu Regalooooo 🎁</button>
  <div class="card" id="message"></div>
</section>

<section id="countdownSection" style="display:none">
  <h2>Contando los días</h2>
  <div class="card agebox">
    <div id="birthBlock" style="display:none">
      <div class="age"><strong id="ageNum"></strong><span>años</span></div>
      <p class="today" id="bdayLine"></p>
      <p class="pill" id="bornLine"></p>
      <div><span class="sub-h">Llevas brillando en este mundo ✨</span></div>
      <div class="countdown" id="lived"></div>
    </div>
    <div id="togetherBlock" style="display:none">
      <div><span class="sub-h">Llevamos juntos 💞</span></div>
      <div class="countdown" id="together"></div>
    </div>
    <div id="reunionBlock" style="display:none">
      <div><span class="sub-h">Para volver a abrazarte 🤗</span></div>
      <div class="countdown" id="countdown"></div>
      <p class="pill" id="reunionText"></p>
    </div>
  </div>
</section>

<section id="reasonsSection">
  <h2>Razones por las que te amo</h2>
  <div class="reasons" id="reasons"></div>
</section>

<section id="openWhenSection" style="display:none">
  <h2>Ábrelo cuando...</h2>
  <div class="letters" id="letters"></div>
</section>

<section id="plansSection" style="display:none">
  <h2>Cuando nos veamos</h2>
  <div class="card"><div class="chips" id="chips"></div></div>
</section>

<section id="timelineSection" style="display:none">
  <h2>Nuestra historia</h2>
  <div class="card"><div class="timeline" id="timeline"></div></div>
</section>

<section id="gallerySection" style="display:none">
  <h2>Nuestros pequeños momentos</h2>
  <div class="gallery" id="gallery"></div>
  <p style="margin-top:22px"><span style="background:var(--card);padding:6px 18px;border-radius:999px">(aunque hay muchos más) 💞</span></p>
</section>

<footer><span id="footer"></span></footer>

<div id="lightbox"><img alt=""></div>
<button id="musicBtn" title="Música">🎵</button>
<audio id="bgm" loop preload="auto"></audio>

<script>
  const S = SETTINGS;
  const LOVE = ['💖','💗','💕','💝','💘','🌷','✨','🌸','🎀'];
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  // Makes any file name safe for a web address (handles ?, #, spaces, accents)
  const urlOf = p => p.split('/').map(encodeURIComponent).join('/');

  document.getElementById('title').textContent = "¡Feliz Cumpleaños, " + S.herName + "! 🎂";
  document.getElementById('subtitle').textContent = S.subtitle;
  document.getElementById('message').textContent = S.message;
  document.getElementById('footer').textContent = "Hecho con mucho amor por " + S.yourName + " 💞";

  const lightbox = document.getElementById('lightbox');
  lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
  function openLightbox(src) { lightbox.querySelector('img').src = src; lightbox.classList.add('show'); }

  // ---------- Collage background ----------
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  let lastW = 0;
  function buildCollage() {
    const c = document.getElementById('collage');
    // Screenshots are left out of the background collage
    const pool = [S.heroPhoto, ...S.photos].filter(p => p && !/screenshot/i.test(p));
    if (!pool.length) return;
    const tile = window.innerWidth < 600 ? 110 : 170;
    document.documentElement.style.setProperty('--tile', tile + 'px');
    const n = (Math.ceil(window.innerWidth / tile) + 1) * (Math.ceil(window.innerHeight / tile) + 1);
    let order = [];
    while (order.length < n) order = order.concat(shuffle(pool.slice()));
    c.innerHTML = '';
    order.slice(0, n).forEach(p => {
      const img = document.createElement('img');
      img.src = urlOf(p);
      img.alt = '';
      img.style.setProperty('--r', (Math.random() * 10 - 5) + 'deg');
      img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
      c.appendChild(img);
    });
    lastW = window.innerWidth;
  }
  buildCollage();
  window.addEventListener('resize', () => { if (window.innerWidth !== lastW) buildCollage(); });

  // ---------- Central photo ----------
  if (S.heroPhoto) {
    const hero = document.getElementById('hero');
    const heroImg = document.getElementById('heroImg');
    heroImg.src = urlOf(S.heroPhoto);
    hero.classList.add('show');
    heroImg.addEventListener('click', () => openLightbox(heroImg.src));
    heroImg.addEventListener('error', () => {
      const d = document.createElement('div');
      d.className = 'broken';
      d.textContent = "No se encontró: " + S.heroPhoto;
      heroImg.replaceWith(d);
    });
  }

  // ---------- Reasons ----------
  const colors = ['#ffe0ec', '#e6dcff', '#fff0d9', '#d9f1ff', '#e0f8e6'];
  const rBox = document.getElementById('reasons');
  S.reasons.forEach((r, i) => {
    const d = document.createElement('div');
    d.className = 'reason';
    d.style.background = colors[i % colors.length];
    const em = document.createElement('span'); em.className = 'em'; em.textContent = LOVE[i % LOVE.length];
    d.append(em, document.createTextNode(r));
    rBox.appendChild(d);
  });

  // ---------- Timeline ----------
  if (S.timeline && S.timeline.length) {
    document.getElementById('timelineSection').style.display = 'block';
    const t = document.getElementById('timeline');
    S.timeline.forEach(e => {
      const d = document.createElement('div'); d.className = 'item';
      const a = document.createElement('div'); a.className = 'date'; a.textContent = e.date;
      const b = document.createElement('div'); b.className = 'text'; b.textContent = e.text;
      d.append(a, b); t.appendChild(d);
    });
  }

  // ---------- Gallery ----------
  if (S.photos.length) {
    document.getElementById('gallerySection').style.display = 'block';
    const g = document.getElementById('gallery');
    S.photos.forEach(p => {
      const fig = document.createElement('figure');
      fig.className = 'polaroid';
      fig.style.setProperty('--r', (Math.random() * 8 - 4) + 'deg');
      const img = document.createElement('img');
      img.src = urlOf(p);
      img.alt = "Nuestro recuerdo";
      img.loading = "lazy";
      img.addEventListener('click', () => openLightbox(img.src));
      img.addEventListener('error', () => {
        const d = document.createElement('div');
        d.className = 'broken';
        d.textContent = "No se encontró: " + p;
        fig.replaceWith(d);
      });
      const cap = document.createElement('figcaption');
      cap.textContent = rnd(LOVE) + ' ' + rnd(LOVE);
      fig.append(img, cap);
      g.appendChild(fig);
    });
  }

  // ---------- Counters (age, time together, reunion) ----------
  const show = id => { document.getElementById(id).style.display = 'block'; };
  const parts = ms => { ms = Math.max(0, ms); return [Math.floor(ms / 864e5), Math.floor(ms % 864e5 / 36e5), Math.floor(ms % 36e5 / 6e4), Math.floor(ms % 6e4 / 1e3)]; };
  const LBL = ['días', 'horas', 'min', 'seg'];
  const boxes = (id, ms) => {
    document.getElementById(id).innerHTML = parts(ms)
      .map((n, i) => `<div><strong>${n}</strong><span>${LBL[i]}</span></div>`).join('');
  };
  const tickers = [];

  if (S.birthDate) {
    show('countdownSection'); show('birthBlock');
    const B = new Date(S.birthDate + "T00:00:00");
    const y = new Date().getFullYear();
    const thisBday = new Date(y, B.getMonth(), B.getDate());
    document.getElementById('ageNum').textContent = y - B.getFullYear();
    document.getElementById('bornLine').textContent =
      "Naciste el " + B.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + " 🌟";
    const line = document.getElementById('bdayLine');
    tickers.push(() => {
      const now = new Date();
      boxes('lived', now - B);
      if (now < thisBday) {
        const [d, h, m, s] = parts(thisBday - now);
        line.textContent = "🎂 Tu día especial empieza en " + (d ? d + " d " : "") + h + " h " + m + " min " + s + " s";
      } else if (now.getMonth() === B.getMonth() && now.getDate() === B.getDate()) {
        line.textContent = "🎉 ¡HOY ES TU DÍA! 🎉";
      } else {
        line.textContent = "💖 Un año más de ti, y qué suerte la mía 💖";
      }
    });
  }

  if (S.togetherSince) {
    show('countdownSection'); show('togetherBlock');
    const T = new Date(S.togetherSince + "T00:00:00");
    tickers.push(() => boxes('together', new Date() - T));
  }

  if (S.reunionDate) {
    show('countdownSection'); show('reunionBlock');
    document.getElementById('reunionText').textContent = S.reunionText;
    const R = new Date(S.reunionDate + "T00:00:00");
    tickers.push(() => boxes('countdown', R - new Date()));
  }
  tickers.forEach(f => f());
  setInterval(() => tickers.forEach(f => f()), 1000);

  // ---------- "Open when" letters ----------
  if (S.openWhen && S.openWhen.length) {
    show('openWhenSection');
    const L = document.getElementById('letters');
    S.openWhen.forEach(o => {
      const d = document.createElement('div');
      d.className = 'letter';
      d.innerHTML = '<div class="env">💌</div><div class="ttl"></div><div class="body"></div>';
      d.querySelector('.ttl').textContent = o.title;
      d.querySelector('.body').textContent = o.text;
      d.addEventListener('click', () => {
        d.classList.toggle('open');
        d.querySelector('.env').textContent = d.classList.contains('open') ? '💖' : '💌';
      });
      L.appendChild(d);
    });
  }

  // ---------- Plans ----------
  if (S.plans && S.plans.length) {
    show('plansSection');
    const chipColors = ['#ffe0ec', '#e6dcff', '#fff0d9', '#d9f1ff', '#e0f8e6'];
    S.plans.forEach((p, i) => {
      const c = document.createElement('span');
      c.className = 'chip';
      c.style.background = chipColors[i % chipColors.length];
      c.textContent = p;
      document.getElementById('chips').appendChild(c);
    });
  }

  // ---------- Music ----------
  const bgm = document.getElementById('bgm');
  const musicBtn = document.getElementById('musicBtn');
  const songs = [].concat(S.music || []).filter(Boolean);
  let songIdx = 0, wantPlay = false;
  if (songs.length) {
    bgm.src = urlOf(songs[0]);
    musicBtn.style.display = 'block';
    bgm.addEventListener('error', () => {
      if (songIdx < songs.length - 1) {            // try the next file name
        songIdx++;
        bgm.src = urlOf(songs[songIdx]);
        if (wantPlay) bgm.play().catch(() => {});
      } else {
        musicBtn.textContent = '⚠️';
        musicBtn.title = 'No se encontró el archivo de música';
        console.warn('No se encontró ninguno de estos archivos de música:', songs);
      }
    });
    musicBtn.addEventListener('click', () => {
      if (bgm.paused) { wantPlay = true; bgm.play().catch(() => {}); musicBtn.textContent = '🎵'; }
      else { wantPlay = false; bgm.pause(); musicBtn.textContent = '🔇'; }
    });
  }

  // ---------- Hearts & confetti ----------
  function heart() {
    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = rnd(['💗','💖','💕','🌸','✨','🎀','🌷','💝']);
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (5 + Math.random() * 5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 10500);
  }
  setInterval(heart, 600);

  function confetti() {
    const cols = ['#ff6fa5', '#e0457b', '#8b5cf6', '#fbbf24', '#34d399', '#60a5fa'];
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = cols[i % cols.length];
      c.style.animationDuration = (2.6 + Math.random() * 2.6) + 's';
      c.style.animationDelay = (Math.random() * 0.9) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 7000);
    }
  }

  // ---------- Open gift (browsers only allow music after a click) ----------
  document.getElementById('openBtn').addEventListener('click', () => {
    document.getElementById('message').classList.add('show');
    document.getElementById('openBtn').style.display = 'none';
    if (songs.length) { wantPlay = true; bgm.play().catch(() => {}); }
    confetti();
    for (let i = 0; i < 25; i++) setTimeout(heart, i * 80);
  });
</script>
</body>
</html>
